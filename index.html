<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cell: Multiverse Absorption</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div>
          <span class="label">Cell</span>
          <strong id="cell-name">MORPH 1</strong>
        </div>
        <div>
          <span class="label">Punteggio</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">Vita</span>
          <strong id="hp">100</strong>
        </div>
        <div>
          <span class="label">Stato</span>
          <strong id="status">Caccia multiverso</strong>
        </div>
      </header>

      <canvas id="gameCanvas" width="960" height="600"></canvas>

      <div class="controls">
        <p>Muovi: WASD / Frecce</p>
        <p>Premi <strong>R</strong> per riavviare</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
